<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>网速测试 · Speed Test（浏览器直接测，无需装 App）</title>
<meta name="description" content="在浏览器里测延迟、下行与上行速度：4 线程并发拉流 + 2 线程上传随机数据，表盘实时显示。无需安装、不注册，测完即走。" />
<meta property="og:title" content="网速测试 · Speed Test" />
<meta property="og:description" content="浏览器里测延迟 / 下行 / 上行，4 线程并发拉流，表盘实时显示。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 18a9 9 0 0 1 16 0'/%3E%3Cpath d='M12 18l4-5'/%3E%3C/svg%3E" />
<style>
/* ⚠️ 必须在所有组件规则之前：浮层用 display 非 none，不加这条 hidden 属性会失效 */
[hidden] { display: none !important; }

:root {
  --bg: #f5f6fa; --surface: #ffffff; --surface2: #f2f4f9;
  --text: #1b2130; --muted: #6b7385; --border: #e2e6ef;
  --primary: #2563eb; --purple: #7c3aed; --cyan: #22d3ee;
  --shadow: 0 8px 28px rgba(23, 32, 64, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1017; --surface: #151a24; --surface2: #1b2130;
    --text: #e8ecf4; --muted: #8b93a7; --border: #262d3b;
    --shadow: 0 10px 34px rgba(0, 0, 0, .45);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 780px; margin: 0 auto; padding: 26px 20px 56px; }

.head h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .2px; }
.head p { margin: 0 0 20px; color: var(--muted); }
.head b { color: var(--text); }

.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 26px 26px 22px; text-align: center;
  box-shadow: var(--shadow);
}

.gauge { position: relative; width: min(320px, 78vw); margin: 0 auto; }
.gauge svg { width: 100%; display: block; }
.gauge-num {
  position: absolute; left: 0; right: 0; bottom: 6px;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.gauge-num .phase { font-size: 12px; color: var(--muted); }
.gauge-num b {
  font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums;
  font-weight: 700; letter-spacing: -.5px;
}
.gauge-num .unit { font-size: 11.5px; color: var(--muted); letter-spacing: .4px; }

.result-row { display: flex; gap: 12px; justify-content: center; margin: 20px 0 4px; flex-wrap: wrap; }
.result {
  min-width: 132px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface2); padding: 10px 16px;
  display: flex; flex-direction: column; gap: 3px;
}
.r-label { font-size: 12px; color: var(--muted); }
.result b { font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 650; }
.result.down b { color: var(--primary); }
.result.up b { color: var(--purple); }

.progress { height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 18px auto 0; max-width: 420px; }
.progress i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--cyan), var(--primary), var(--purple));
  transition: width .25s ease;
}

.go {
  margin-top: 20px; padding: 13px 58px; border: none; border-radius: 999px;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 20px rgba(37, 99, 235, .3);
}
.go:hover:not(:disabled) { filter: brightness(1.08); }
.go:disabled { opacity: .55; cursor: default; box-shadow: none; }
.tip { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; }
.tip b { color: var(--text); }

.foot {
  margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border);
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  color: var(--muted); font-size: 12.5px;
}
.foot a { color: var(--primary); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <h1>网速测试</h1>
    <p>
      测浏览器到测速节点的<b>延迟</b>、<b>下行</b>与<b>上行</b>速度 —— 4 线程并发拉流、2 线程上传不可压缩随机数据，
      表盘实时跟着速度走。不装 App、不注册，测完即走。
    </p>
  </header>

  <section class="panel">
    <div class="gauge">
      <svg viewBox="0 0 220 130" aria-hidden="true">
        <path d="M16 118 A 94 94 0 0 1 204 118" fill="none" stroke="var(--border)" stroke-width="14" stroke-linecap="round" />
        <path id="arc" d="M16 118 A 94 94 0 0 1 204 118" fill="none" stroke="url(#gg)" stroke-width="14"
              stroke-linecap="round" stroke-dasharray="0 999" />
        <defs>
          <linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#22d3ee" />
            <stop offset="0.6" stop-color="#2563eb" />
            <stop offset="1" stop-color="#7c3aed" />
          </linearGradient>
        </defs>
      </svg>
      <div class="gauge-num">
        <span class="phase" id="phaseText">准备就绪</span>
        <b id="bigNum">—</b>
        <span class="unit">Mbps</span>
      </div>
    </div>

    <div class="result-row">
      <div class="result">
        <span class="r-label">延迟</span>
        <b id="rPing">—</b>
      </div>
      <div class="result down">
        <span class="r-label">↓ 下行</span>
        <b id="rDown">—</b>
      </div>
      <div class="result up">
        <span class="r-label">↑ 上行</span>
        <b id="rUp">—</b>
      </div>
    </div>

    <div class="progress" id="progWrap" hidden><i id="progBar"></i></div>

    <button type="button" class="go" id="go">开始测试</button>
    <p class="tip" id="tip" hidden></p>
  </section>

  <footer class="foot">
    <span>纯浏览器测速 · 无需安装</span>
    <span>
      <a href="https://github.com/bushimashen/speed-test" target="_blank" rel="noopener">GitHub</a>
      · <a href="https://gitee.com/codegoder/speed-test" target="_blank" rel="noopener">Gitee</a>
    </span>
  </footer>
</div>

<script>
/* ============ 测速节点 ============
   独立版没有自己的后端，默认用 Cloudflare 的公开测速端点（带 CORS，无需密钥）。
   想换成自己的服务器，改这里两个 URL 即可：
     DOWN: GET  ?bytes=<字节数>   返回该长度的随机数据
     UP:   POST 任意二进制         返回 2xx 即算成功
   ⚠️ 自建时务必开 Access-Control-Allow-Origin，否则浏览器读不到响应。 */
const NODE = 'https://speed.cloudflare.com'
const DOWN_URL = (bytes) => `${NODE}/__down?bytes=${bytes}`
const UP_URL = `${NODE}/__up`
const PING_URL = () => `${NODE}/__down?bytes=1&_=${Math.random()}`

const ARC = 295 // 半圆总长 ≈ π × 94

const $ = (id) => document.getElementById(id)
const el = {
  arc: $('arc'), phase: $('phaseText'), big: $('bigNum'),
  ping: $('rPing'), down: $('rDown'), up: $('rUp'),
  progWrap: $('progWrap'), prog: $('progBar'),
  go: $('go'), tip: $('tip')
}

const state = { phase: 'idle', ping: 0, down: 0, up: 0, upBytes: 0, live: 0, progress: 0 }

function render() {
  const phaseTxt = {
    idle: '准备就绪', ping: '测延迟…', down: '下行测速…', up: '上行测速…', done: '测试完成'
  }[state.phase]
  el.phase.textContent = phaseTxt

  if (state.phase === 'idle') el.big.textContent = '—'
  else if (state.phase === 'done') el.big.textContent = state.down.toFixed(1)
  else el.big.textContent = state.live.toFixed(1)

  el.ping.textContent = state.ping ? state.ping + ' ms' : '—'
  el.down.textContent = state.down ? state.down.toFixed(1) + ' Mbps' : '—'
  el.up.textContent = state.up ? state.up.toFixed(1) + ' Mbps' : '—'

  el.progWrap.hidden = state.phase === 'idle'
  el.prog.style.width = state.progress + '%'

  // 表盘：1~1000 Mbps 对数映射，视觉上低速段也能看出变化
  const v = state.phase === 'up' ? state.up : (state.down || state.live)
  let len = 0
  if (v) {
    const t = Math.log10(Math.min(v, 1000)) / 3
    len = Math.max(4, Math.min(1, t) * ARC)
  }
  el.arc.setAttribute('stroke-dasharray', len + ' 999')

  el.go.disabled = state.phase !== 'idle' && state.phase !== 'done'
  el.go.textContent = state.phase === 'idle' ? '开始测试' : '再测一次'
}

function grade(d) {
  if (d >= 500) return '千兆级 🚀'
  if (d >= 200) return '高速 ⚡'
  if (d >= 100) return '良好 👍'
  if (d >= 30) return '日常够用 🙂'
  if (d >= 5) return '偏慢 🐢'
  return '很慢，建议检查网络'
}

/* ---------- 1 延迟：取 6 次 RTT 的中位数，避开单次抖动 ---------- */
async function measurePing() {
  state.phase = 'ping'; state.progress = 2; render()
  const arr = []
  for (let i = 0; i < 6; i++) {
    try {
      const t0 = performance.now()
      await fetch(PING_URL(), { cache: 'no-store' })
      arr.push(performance.now() - t0)
    } catch (e) { /* 单次失败忽略 */ }
    state.progress = 2 + (i + 1) * 4.5; render()
  }
  arr.sort((a, b) => a - b)
  state.ping = Math.round(arr[Math.floor(arr.length / 2)] || 0)
  render()
}

/* ---------- 2 下行：4 线程并发，块大小自适应，跑满 9 秒 ---------- */
async function measureDown() {
  state.phase = 'down'; render()
  const DURATION = 9000
  const t0 = performance.now()
  let bytes = 0
  let mb = 8

  const worker = async () => {
    while (performance.now() - t0 < DURATION) {
      try {
        const r = await fetch(DOWN_URL(mb * 1048576) + '&_=' + Math.random(), { cache: 'no-store' })
        const buf = await r.arrayBuffer()
        bytes += buf.byteLength
        // 一个块 100ms 内就下完说明还有余量，把块加大
        if (buf.byteLength < mb * 1048576 * 0.9 && mb < 32) mb = Math.min(32, mb * 2)
      } catch (e) { break }
    }
  }

  const tick = setInterval(() => {
    const sec = (performance.now() - t0) / 1000
    state.live = (bytes * 8) / 1e6 / Math.max(0.5, sec)
    state.progress = 34 + Math.min(32, (sec / (DURATION / 1000)) * 32)
    render()
  }, 200)

  await Promise.all([worker(), worker(), worker(), worker()])
  clearInterval(tick)
  state.down = (bytes * 8) / 1e6 / (DURATION / 1000)
  state.live = 0
  render()
}

/* ---------- 3 上行：2 线程 POST 不可压缩随机块，跑满 8 秒 ---------- */
async function measureUp() {
  state.phase = 'up'; render()

  // 必须用随机数据：全零会被压缩，测出的上行会虚高
  const makeBlob = (mb) => {
    const arr = new Uint8Array(mb * 1024 * 1024)
    for (let i = 0; i < arr.length; i += 65536) {
      crypto.getRandomValues(arr.subarray(i, Math.min(i + 65536, arr.length)))
    }
    return new Blob([arr])
  }
  const blobs = [makeBlob(8), makeBlob(16)]

  const DURATION = 8000
  const t0 = performance.now()
  let bytes = 0
  let bi = 0

  const worker = async () => {
    while (performance.now() - t0 < DURATION) {
      const b = blobs[bi++ % blobs.length]
      try {
        const fd = new FormData()
        fd.append('file', b, 'chunk.bin')
        await fetch(UP_URL, { method: 'POST', body: fd })
        bytes += b.size
      } catch (e) { break }
    }
  }

  const tick = setInterval(() => {
    const sec = (performance.now() - t0) / 1000
    state.live = (bytes * 8) / 1e6 / Math.max(0.5, sec)
    state.progress = 66 + Math.min(33, (sec / (DURATION / 1000)) * 33)
    render()
  }, 200)

  await Promise.all([worker(), worker()])
  clearInterval(tick)
  state.up = (bytes * 8) / 1e6 / (DURATION / 1000)
  state.upBytes = bytes
  state.live = 0
  render()
}

async function start() {
  state.ping = 0; state.down = 0; state.up = 0; state.progress = 0
  el.tip.hidden = true
  await measurePing()
  await measureDown()
  await measureUp()
  state.progress = 100
  state.phase = 'done'
  render()

  el.tip.hidden = false
  const upMB = Math.round(state.upBytes / 1048576)
  el.tip.innerHTML = `评级：<b>${grade(state.down)}</b> · 数据为瞬时实测值，受 WiFi / 运营商波动影响；`
    + `测上行会消耗与结果相当的流量（本次实际上传约 ${upMB} MB）。`
}

el.go.addEventListener('click', start)
render()
</script>
</body>
</html>
